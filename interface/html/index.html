<!DOCTYPE html>
<html>

<head>
    <title>IRIS</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://fonts.googleapis.com/css?family=Instrument Serif' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
    <style>
        body {
            font-family: 'Instrument Serif';
            font-size: 22px;
            margin: 40px;
            background: #233C5D;
            background: radial-gradient(circle, rgba(35, 60, 93, 1) 0%, rgba(0, 189, 198, 1) 50%);
        }

        .title {
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            text-align: center;
            gap: 0px;
        }

        #h1 {
            margin-top: 70px;
            margin-bottom: auto;
            color: #233C5D;
            font-size: 50px;
        }

        .h2 {
            margin-top: auto;
            font-size: 30px;
            color: #233C5D;
            letter-spacing: 1px;
        }

        .h3 {
            color: #00BDC6;
            font-size: 28px;
            margin-bottom: 10px;
        }

        h3 {
            max-width: 200px;
            font-family: 'Inter';
            color: #FFFFFF;
            font-size: 16px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            gap: 50px;
        }

        .category {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .card {
            padding: 20px;
            max-width: 200px;
            max-height: 250px;
            background: #D9D9D9;
            background: radial-gradient(circle, rgba(217, 217, 217, 1) 0%, rgba(255, 255, 255, 1) 50%);
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #video {
            width: 100%;
            max-width: 500px;
            border: 2px solid #233C5D;
            margin: 10px 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* 3 colonnes égales */
            gap: 20px;
            /* espace entre les cards */
        }

        .photo {
            width: 50px;
            height: 50px;
            background: #233C5D;
            margin-bottom: 10px;
        }

        .status {
            padding: 10px;
            background: #222;
            margin: 10px 0;
            border-left: 4px solid #233C5D;
        }

        .pool-viewer {
            background: #0a0a0a;
            padding: 10px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="title">
        <p id="h1">Iris</p>
        <p class="h2" id="h2">INTELLIGENT RESOURCE FOR SHORT-SIGHTED INDIVIDUAL</p>
    </div>

    <div class="container">
        <div class="category">
            <h3>YOUR VISUAL DEFICIENCY</h3>
            <div class="card">
                <p class=" h3" id="visual deficiency">Total Blindness</p>
                <p>Total Blindness is a condition where an individual has no light perception.</p>
            </div>
        </div>

        <canvas id="video" width="640" height="480" style="border: 2px solid #233C5D;"></canvas>

        <div class="category">
            <h3>YOUR CLOSED ONES</h3>
            <div class="grid">
                <div class="card" id="closed ones">
                    <div class="photo"></div>
                    <p class="h3">NAME</p>
                </div>
                <div class="card" id="closed ones">
                    <div class="photo"></div>
                    <p class="h3">NAME</p>
                </div>
                <div class="card" id="closed ones">
                    <div class="photo"></div>
                    <p class="h3">NAME</p>
                </div>
            </div>

        </div>

    </div>

    <div>
        <button id="startBtn" onclick="startPipeline()">▶️ Start</button>
        <button id="stopBtn" onclick="stopPipeline()" disabled>⏹️ Stop</button>
    </div>

    <div class="status">
        Status: <span id="status">stopped</span>
    </div>

    <h3>Pool State (Real-time)</h3>
    <div class="pool-viewer" id="poolViewer">{...}</div>

    <script>
        const canvas = document.getElementById('video');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        let videoWs = null;
        let poolWs = null;

        // Get the current hostname and port for WebSocket connections
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;

        async function startPipeline() {
            const res = await fetch('/api/start', { method: 'POST' });
            const data = await res.json();
            if (res.ok) {
                statusEl.textContent = 'running';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                connectWebSockets();
            } else {
                alert('Error: ' + (data.error || 'Unknown error'));
            }
        }

        async function stopPipeline() {
            const res = await fetch('/api/stop', { method: 'POST' });
            if (res.ok) {
                statusEl.textContent = 'stopped';
                startBtn.disabled = false;
                stopBtn.disabled = true;
                if (videoWs) videoWs.close();
                if (poolWs) poolWs.close();
            }
        }

        function connectWebSockets() {
            // Video stream
            videoWs = new WebSocket(`${wsUrl}/ws/video`);
            videoWs.binaryType = 'arraybuffer';
            videoWs.onmessage = (event) => {
                const blob = new Blob([event.data]);
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                };
                img.onerror = () => URL.revokeObjectURL(url);
                img.src = url;
            };
            videoWs.onerror = (err) => console.error('Video WS error:', err);

            // Pool updates
            poolWs = new WebSocket(`${wsUrl}/ws/pool`);
            poolWs.onmessage = (event) => {
                try {
                    document.getElementById('poolViewer').textContent =
                        JSON.stringify(JSON.parse(event.data), null, 2);
                } catch (e) {
                    console.error('Failed to parse pool data:', e);
                }
            };
            poolWs.onerror = (err) => console.error('Pool WS error:', err);
        }
    </script>
</body>

</html>
