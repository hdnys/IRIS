<!DOCTYPE html>
<html>

<head>
    <title>IRIS</title>
    <link rel="stylesheet" href="/interface/css/index.css">
    <link href='https://fonts.googleapis.com/css?family=Instrument+Serif' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
</head>

<body>
    <div class="header">
        <button id="settingsBtn" class="headerbtn" onclick="window.location.href='/interface/html/settings.html'">SETTINGS</button>
        <button id="aboutBtn"    class="headerbtn" onclick="window.location.href='/interface/html/about.html'">ABOUT</button>
        <button id="contactBtn"  class="headerbtn" onclick="window.location.href='/interface/html/contact.html'">CONTACT</button>
        <button id="entourageBtn" class="headerbtn" onclick="window.location.href='/interface/html/closedones.html'">ENTOURAGE</button>
    </div>

    <div class="title">
        <p id="h1">Iris</p>
        <p class="h2" id="h2">INTELLIGENT RESOURCE FOR SHORT-SIGHTED INDIVIDUAL</p>
    </div>

    <!-- ── Main content row ────────────────────────────────── -->
    <div class="container">

        <!-- Visual deficiency — clickable card -->
        <div class="category">
            <h3>YOUR VISUAL DEFICIENCY</h3>
            <div class="card clickable-card"
                 onclick="window.location.href='/interface/html/visualdeficiency.html'"
                 title="Click to change your visual profile">
                <p class="h3" id="profileLabel" style="margin-top:20px;">Loading…</p>
                <p id="profileDesc" style="font-size:14px; color:#555;">—</p>
                <p class="change-hint">Tap to change →</p>
            </div>
        </div>

        <!-- Camera feed — dimensions set dynamically to match the server frame -->
        <div class="video-wrap">
            <canvas id="video"></canvas>
            <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Fullscreen">⛶</button>
        </div>

        <!-- Entourage -->
        <div class="category">
            <h3>YOUR ENTOURAGE</h3>
            <div class="grid" id="friendsGrid">
                <!-- populated by JS -->
            </div>
            <a class="see-all" href="/interface/html/closedones.html">View all →</a>
        </div>

    </div>

    <!-- ── Controls ────────────────────────────────────────── -->
    <div style="text-align:center; margin-top:18px;">
        <button id="startBtn" onclick="startPipeline()">▶ Start</button>
        <button id="stopBtn"  onclick="stopPipeline()" disabled>⏹ Stop</button>
    </div>

    <div class="status">
        Status: <span id="status">stopped</span>
    </div>

    <h3 style="max-width:100%; color:#e0e0e0;">Pool State (Real-time)</h3>
    <div class="pool-viewer" id="poolViewer">{…}</div>

    <!-- ── Add-to-entourage modal ───────────────────────────── -->
    <div id="learnModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-title">Add to Entourage</div>
            <input class="modal-input" type="text" id="learnName"
                   placeholder="First name" maxlength="30"
                   onkeydown="if(event.key==='Enter') startLearning()">
            <div id="learnStatus" class="modal-status"></div>
            <div class="modal-actions">
                <button class="modal-btn-start" id="learnStartBtn" onclick="startLearning()">Start →</button>
                <button class="modal-btn-cancel" onclick="cancelLearning()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        /* ── Profile lookup ──────────────────────────────────── */
        const PROFILES = {
            total_blindness: { label: 'Total Blindness', desc: 'No light perception' },
            low_vision:      { label: 'Low Vision',      desc: 'Some residual vision' },
            tunnel_vision:   { label: 'Tunnel Vision',   desc: 'Central vision only' },
            color_blindness: { label: 'Color Blindness', desc: 'Cannot distinguish colors' },
            peripheral_loss: { label: 'Peripheral Loss', desc: 'Reduced side vision' },
        };

        /* ── WebSocket / pipeline ────────────────────────────── */
        const canvas   = document.getElementById('video');
        const ctx      = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const stopBtn  = document.getElementById('stopBtn');
        let videoWs = null;
        let poolWs  = null;

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl    = `${protocol}//${window.location.host}`;

        async function startPipeline() {
            const res  = await fetch('/api/start', { method: 'POST' });
            const data = await res.json();
            if (res.ok && data.status !== 'failed') {
                statusEl.textContent = 'running';
                startBtn.disabled = true;
                stopBtn.disabled  = false;
                connectWebSockets();
            } else {
                alert('Error: ' + (data.error || 'Unknown error'));
            }
        }

        async function stopPipeline() {
            const res = await fetch('/api/stop', { method: 'POST' });
            if (res.ok) {
                statusEl.textContent = 'stopped';
                startBtn.disabled = false;
                stopBtn.disabled  = true;
                if (videoWs) videoWs.close();
                if (poolWs)  poolWs.close();
            }
        }

        function connectWebSockets() {
            videoWs = new WebSocket(`${wsUrl}/ws/video`);
            videoWs.binaryType = 'arraybuffer';
            videoWs.onmessage = (event) => {
                const blob = new Blob([event.data]);
                const url  = URL.createObjectURL(blob);
                const img  = new Image();
                img.onload = () => {
                    // Match canvas resolution to the actual frame so the full
                    // field of view is always shown without cropping.
                    if (canvas.width  !== img.naturalWidth ||
                        canvas.height !== img.naturalHeight) {
                        canvas.width  = img.naturalWidth;
                        canvas.height = img.naturalHeight;
                    }
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                };
                img.onerror = () => URL.revokeObjectURL(url);
                img.src = url;
            };
            videoWs.onerror = (e) => console.error('Video WS error:', e);

            poolWs = new WebSocket(`${wsUrl}/ws/pool`);
            poolWs.onmessage = (event) => {
                try {
                    document.getElementById('poolViewer').textContent =
                        JSON.stringify(JSON.parse(event.data), null, 2);
                } catch (e) { /* ignore */ }
            };
            poolWs.onerror = (e) => console.error('Pool WS error:', e);
        }

        /* ── Current visual-deficiency profile ───────────────── */
        async function loadCurrentProfile() {
            try {
                const res = await fetch('/api/config');
                if (!res.ok) return;
                const cfg = await res.json();
                const key = cfg.user_profile?.vision_profile || 'total_blindness';
                const p   = PROFILES[key] || { label: key, desc: '' };
                document.getElementById('profileLabel').textContent = p.label;
                document.getElementById('profileDesc').textContent  = p.desc;
            } catch (e) {
                document.getElementById('profileLabel').textContent = 'Total Blindness';
                document.getElementById('profileDesc').textContent  = '';
            }
        }

        /* ── Entourage grid (up to 3 friends + 1 add slot) ─────── */
        async function loadFriends() {
            try {
                const res  = await fetch('/api/friends');
                const data = await res.json();
                const grid = document.getElementById('friendsGrid');
                grid.innerHTML = '';

                const friends = (data.friends || []).slice(0, 3);
                friends.forEach(friend => {
                    const card = document.createElement('div');
                    card.className = 'friend-mini';
                    if (friend.images && friend.images.length > 0) {
                        const src = `/data/${friend.name}/${friend.images[0]}`;
                        card.innerHTML =
                            `<img src="${src}" alt="${friend.name}"
                                  onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                             <span class="initial" style="display:none">${friend.name[0].toUpperCase()}</span>
                             <span>${friend.name}</span>`;
                    } else {
                        card.innerHTML =
                            `<span class="initial">${friend.name[0].toUpperCase()}</span>
                             <span>${friend.name}</span>`;
                    }
                    grid.appendChild(card);
                });

                // 4th slot is always the add button
                const addSlot = document.createElement('div');
                addSlot.className = 'friend-mini friend-add-slot';
                addSlot.title = 'Add to entourage';
                addSlot.onclick = openLearnModal;
                addSlot.innerHTML = '<span class="add-plus">+</span>';
                grid.appendChild(addSlot);
            } catch (e) {
                console.error('Error loading friends:', e);
            }
        }

        /* ── Fullscreen ──────────────────────────────────────── */
        function toggleFullscreen() {
            const wrap = document.querySelector('.video-wrap');
            if (!document.fullscreenElement) {
                (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            }
        }

        /* ── TTS helper ──────────────────────────────────────── */
        let _lastSpoken = '';
        function speak(text) {
            if (!window.speechSynthesis || !text || text === _lastSpoken) return;
            _lastSpoken = text;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        }

        /* ── Add-to-entourage panel ──────────────────────────── */
        let _learningPoll = null;

        function openLearnModal() {
            document.getElementById('learnModal').style.display  = 'flex';
            document.getElementById('learnName').value           = '';
            document.getElementById('learnStatus').textContent   = '';
            document.getElementById('learnStatus').style.color   = '#00BDC6';
            document.getElementById('learnStartBtn').disabled    = false;
            document.getElementById('learnName').disabled        = false;
            document.getElementById('learnName').focus();
            _lastSpoken = '';
            speak('Add to entourage. Enter a first name and press Start.');
        }

        function closeLearnModal() {
            document.getElementById('learnModal').style.display = 'none';
            if (_learningPoll) { clearInterval(_learningPoll); _learningPoll = null; }
            window.speechSynthesis && window.speechSynthesis.cancel();
            _lastSpoken = '';
        }

        async function startLearning() {
            const name   = document.getElementById('learnName').value.trim();
            if (!name) return;
            const status = document.getElementById('learnStatus');
            status.textContent = 'Starting…';
            status.style.color = '#00BDC6';
            speak('Starting. Look at the camera and follow the instructions.');
            try {
                const res  = await fetch('/api/entourage/start', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ name }),
                });
                const data = await res.json();
                if (!res.ok || data.status !== 'started') {
                    const msg = '✗ ' + (data.error || 'Could not start');
                    status.textContent = msg;
                    status.style.color = '#ff7070';
                    speak(data.error || 'Could not start. Is the pipeline running?');
                    return;
                }
                document.getElementById('learnStartBtn').disabled = true;
                document.getElementById('learnName').disabled     = true;
                status.textContent = 'Look at the camera…';
                _pollLearningStatus();
            } catch (e) {
                status.textContent = '✗ Network error — is the pipeline running?';
                status.style.color = '#ff7070';
                speak('Network error. Is the pipeline running?');
            }
        }

        function _pollLearningStatus() {
            _learningPoll = setInterval(async () => {
                try {
                    const res  = await fetch('/api/entourage/status');
                    const data = await res.json();
                    const status = document.getElementById('learnStatus');
                    if (data.message) {
                        status.textContent = data.message;
                        speak(data.message);
                    }
                    if (data.done) {
                        clearInterval(_learningPoll); _learningPoll = null;
                        status.textContent = '✓ Face saved!';
                        status.style.color = '#00BDC6';
                        speak('Face saved successfully.');
                        setTimeout(() => { closeLearnModal(); loadFriends(); }, 2500);
                    } else if (!data.active && !data.done) {
                        clearInterval(_learningPoll); _learningPoll = null;
                    }
                } catch (e) { /* ignore transient errors */ }
            }, 800);
        }

        async function cancelLearning() {
            await fetch('/api/entourage/cancel', { method: 'POST' }).catch(() => {});
            speak('Cancelled.');
            closeLearnModal();
        }

        /* ── Init ────────────────────────────────────────────── */
        document.addEventListener('DOMContentLoaded', async () => {
            loadFriends();
            loadCurrentProfile();

            // Reconnect to a pipeline that was already running before this page loaded
            try {
                const res  = await fetch('/api/status');
                const data = await res.json();
                if (data.running) {
                    statusEl.textContent  = 'running';
                    startBtn.disabled     = true;
                    stopBtn.disabled      = false;
                    connectWebSockets();
                }
            } catch (e) { /* server not reachable — leave buttons in default state */ }
        });
    </script>
</body>

</html>
