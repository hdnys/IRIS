<!DOCTYPE html>
<html>

<head>
    <title>IRIS - Closed Ones</title>
    <link rel="stylesheet" href="/interface/css/closedones.css">
    <link href='https://fonts.googleapis.com/css?family=Instrument Serif' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
</head>

<body>
    <div class="header">
        <button id="closedonesBtn" class="headerbtn" onclick="window.location.href='/interface/html/index.html'">HOME</button>
        <button id="settingsBtn" class="headerbtn"
            onclick="window.location.href='/interface/html/settings.html'">SETTINGS</button>
        <button id="aboutBtn" class="headerbtn"
            onclick="window.location.href='/interface/html/about.html'">ABOUT</button>
        <button id="contactBtn" class="headerbtn"
            onclick="window.location.href='/interface/html/contact.html'">CONTACT</button>

    </div>

    <div class="title">
        <p id="h1">Your Closed Ones</p>
        <p class="h2" id="h2">INTELLIGENT RESOURCE FOR SHORT-SIGHTED INDIVIDUAL</p>
    </div>

    <div class="container">
        <div class="grid" id="friendsGrid">
            <!-- Friends will be loaded here by JavaScript -->
        </div>
    </div>

    <script>
        // Load registered friends on page load
        async function loadFriends() {
            try {
                const res = await fetch('/api/friends');
                const data = await res.json();
                const friendsGrid = document.getElementById('friendsGrid');
                friendsGrid.innerHTML = '';

                if (data.friends && data.friends.length > 0) {
                    data.friends.forEach(friend => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        // Get random image
                        let photoHTML = `<div class="photo" style="background: linear-gradient(135deg, #00BDC6, #233C5D); display: flex; align-items: center; justify-content: center;"><span style="color: white; font-weight: bold;">${friend.name.charAt(0).toUpperCase()}</span></div>`;
                        
                        if (friend.images && friend.images.length > 0) {
                            const randomImage = friend.images[Math.floor(Math.random() * friend.images.length)];
                            const imageUrl = `/data/${friend.name}/${randomImage}`;
                            photoHTML = `<img src="${imageUrl}" alt="${friend.name}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 5px 5px 0 0;" onerror="this.parentElement.style.background='linear-gradient(135deg, #00BDC6, #233C5D)'; this.style.display='none';">`;
                        }
                        
                        card.innerHTML = `
                            ${photoHTML}
                            <p class="h3" style="margin-top: 10px;">${friend.name}</p>
                        `;
                        friendsGrid.appendChild(card);
                    });
                } else {
                    friendsGrid.innerHTML = '<p style="grid-column: 1/-1; color: #fff;">No registered friends yet</p>';
                }
            } catch (err) {
                console.error('Error loading friends:', err);
            }
        }

        // Load friends when page loads
        document.addEventListener('DOMContentLoaded', loadFriends);
    </script>
    <script src="/interface/js/voice-commands.js"></script>
</body>

</html>
