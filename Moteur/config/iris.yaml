adapters:
  vlm:
    module: Moteur.adapters.vlm_ollama
    class: OllamaVLM
    params:
      model: llava-phi3
      model_describe: llama3.2
      host: http://127.0.0.1:11434
      keep_alive: -1
      timeout_s: 120
      max_image_side: 512
      num_ctx: 2048
      temperature: 0.3
      num_predict_static: 400
      num_predict_describe: null
      departure_grace_s: 300
  object_detection:
    module: Moteur.adapters.objdet_yolo
    class: YoloObjectDetector
    params:
      weights_path: models/yolo12n.pt
      conf_threshold: 0.25
      iou_threshold: 0.45
      max_image_side: 640
      keep_classes: null
      exclude_classes: []
      device: null
      verbose: false
  face_recognition:
    module: Moteur.adapters.face_sface
    class: SFaceAdapter
    params:
      yunet_path: models/face_detection_yunet_2023mar.onnx
      sface_path: models/face_recognition_sface_2021dec.onnx
      gallery_dir: data
      cos_threshold: 0.38
      det_confidence: 0.6
      det_nms: 0.3
      top_k: 5000
pipeline:
  max_workers: 4
  infer_cooldown_s: 9
  annotate_vlm_faces: true
  annotate_vlm_objects: true
  camera_index: 0
scene_gate:
  trigger_score: 0.55
  weights:
    dhash: 0.3
    face_count: 0.15
    identity: 0.2
    flow: 0.1
    embedding: 0.2
    objects: 0.1
    person_count: 0.2
  thresholds:
    dhash_max_bits: 64
    flow_max: 5.0
    embedding_max: 0.4
  mobilenet_path: models/image_classification_mobilenetv2_2022apr.onnx
  download_if_missing: true
user_profile:
  vision_profile: color_blindness
  preferred_language: en-US
  verbosity: detailed
  known_people: []
